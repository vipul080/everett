<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Everett Lab</title>
<meta name="description" content="Deterministic multiverse testing for distributed systems — explore universes, find the one that breaks, and scrub through it.">
<style>
:root {
  --bg: #f6f7f9;
  --panel: #ffffff;
  --panel-2: #f0f2f5;
  --border: #dde1e7;
  --text: #1b2130;
  --muted: #5c6779;
  --faint: #a7afbc;
  --grid: #e8ebf0;
  --accent: #0a84a8;
  --leader: #c98500;
  --candidate: #7a4fd6;
  --follower: #b8c0cc;
  --ok: #2f9e44;
  --info: #d08c00;
  --failop: #98a2b3;
  --bad: #e03131;
  --fault: #e6a700;
  --pause: #8892a3;
  --m-blue: #3b7bdb;
  --m-teal: #12a594;
  --m-violet: #8b5cf6;
  --m-orange: #e8730c;
  --m-red: #e03131;
  --m-gray: #8a94a6;
  --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 4px 16px rgba(16, 24, 40, .06);
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a0d13;
    --panel: #10141c;
    --panel-2: #161b25;
    --border: #232a37;
    --text: #d9dfe9;
    --muted: #8d97a9;
    --faint: #4a5466;
    --grid: #1a202b;
    --accent: #5fd0ea;
    --leader: #ffc94d;
    --candidate: #b99cff;
    --follower: #3a4352;
    --ok: #7fd66a;
    --info: #ffc94d;
    --failop: #5a6476;
    --bad: #ff6b6b;
    --fault: #ffd166;
    --pause: #6d7789;
    --m-blue: #6aa5ff;
    --m-teal: #3ad6c0;
    --m-violet: #b99cff;
    --m-orange: #ff9f5a;
    --m-red: #ff6b6b;
    --m-gray: #7c8698;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}

:root[data-theme="dark"] {
  --bg: #0a0d13;
  --panel: #10141c;
  --panel-2: #161b25;
  --border: #232a37;
  --text: #d9dfe9;
  --muted: #8d97a9;
  --faint: #4a5466;
  --grid: #1a202b;
  --accent: #5fd0ea;
  --leader: #ffc94d;
  --candidate: #b99cff;
  --follower: #3a4352;
  --ok: #7fd66a;
  --info: #ffc94d;
  --failop: #5a6476;
  --bad: #ff6b6b;
  --fault: #ffd166;
  --pause: #6d7789;
  --m-blue: #6aa5ff;
  --m-teal: #3ad6c0;
  --m-violet: #b99cff;
  --m-orange: #ff9f5a;
  --m-red: #ff6b6b;
  --m-gray: #7c8698;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font: 13px/1.45 var(--sans);
  -webkit-font-smoothing: antialiased;
}
button, input, select { font: inherit; color: inherit; }

/* ── header ─────────────────────────────────────────────────────────────── */
.top {
  display: flex; align-items: center; gap: 16px;
  padding: 10px 16px;
  border-bottom: 1px solid var(--border);
  background: var(--panel);
  position: sticky; top: 0; z-index: 5;
}
.brand { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.logo { width: 28px; height: 28px; color: var(--accent); }
.name { font: 600 15px/1.1 var(--mono); letter-spacing: .02em; }
.tag { color: var(--muted); font-size: 11px; }
.verdict {
  flex: 1; min-width: 0;
  font-size: 12.5px;
  padding: 6px 10px; border-radius: 8px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.verdict.bad { background: color-mix(in srgb, var(--bad) 12%, transparent); color: var(--bad); }
.verdict.good { background: color-mix(in srgb, var(--ok) 12%, transparent); color: var(--ok); }
.verdict .meta { color: var(--muted); margin-left: 8px; }
.top-actions { display: flex; gap: 6px; flex-shrink: 0; }

/* ── controls ───────────────────────────────────────────────────────────── */
button {
  border: 1px solid var(--border); background: var(--panel-2);
  border-radius: 7px; padding: 5px 10px; cursor: pointer;
}
button:hover { border-color: var(--faint); }
button:disabled { opacity: .5; cursor: default; }
button.primary {
  background: var(--accent); border-color: var(--accent);
  color: var(--bg); font-weight: 600;
}
button.primary:hover { filter: brightness(1.08); }
button.ghost { background: transparent; }
button.icon { width: 32px; padding: 5px 0; }
select, input[type="number"] {
  background: var(--panel-2); border: 1px solid var(--border);
  border-radius: 7px; padding: 5px 8px; width: 100%;
}

/* ── layout ─────────────────────────────────────────────────────────────── */
.layout {
  display: grid;
  grid-template-columns: 300px minmax(0, 1fr);
  min-height: calc(100vh - 53px);
}
.lab {
  border-right: 1px solid var(--border);
  background: var(--panel);
  padding: 14px 16px;
  display: flex; flex-direction: column; gap: 14px;
}
.lab h2 { margin: 0 0 8px; font-size: 14px; }
.lab h3, .panel h3 { margin: 0 0 8px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.lab section { display: flex; flex-direction: column; gap: 6px; }
.lab .row2 { flex-direction: row; gap: 10px; }
.lab .buttons { flex-direction: row; gap: 8px; }
.lab .buttons .primary { flex: 1; }
.field { display: flex; flex-direction: column; gap: 4px; flex: 1; }
.field > span { font-size: 11px; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: 12px; margin: 0; }

.bugs { display: flex; flex-direction: column; gap: 4px; }
.bug {
  display: grid; grid-template-columns: 16px 1fr; gap: 8px; align-items: start;
  padding: 6px 8px; border-radius: 7px; border: 1px solid transparent; cursor: pointer;
}
.bug:hover { background: var(--panel-2); }
.bug.on { border-color: color-mix(in srgb, var(--bad) 45%, transparent); background: color-mix(in srgb, var(--bad) 7%, transparent); }
.bug input { margin: 2px 0 0; accent-color: var(--bad); }
.bug b { font: 600 12px var(--mono); }
.bug span { display: block; color: var(--muted); font-size: 11.5px; line-height: 1.35; margin-top: 2px; }

.grid { width: 100%; height: 150px; border-radius: 8px; background: var(--panel-2); display: block; cursor: pointer; }
.grid[hidden] { display: none; }
.lab-status { min-height: 3.5em; }
.lab-status b { color: var(--text); }
.lab-status .bad { color: var(--bad); }
.lab-status .good { color: var(--ok); }

/* ── viewer ─────────────────────────────────────────────────────────────── */
.viewer { display: flex; flex-direction: column; min-width: 0; padding: 12px 16px 16px; gap: 10px; }
.toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.transport, .view-actions { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.transport select { width: auto; }
.clock { font: 600 14px var(--mono); min-width: 74px; text-align: right; }
.chips { display: flex; gap: 4px; flex-wrap: wrap; }
.chip {
  font: 11px var(--mono); padding: 3px 8px; border-radius: 999px;
  border: 1px solid var(--border); cursor: pointer; user-select: none;
  display: inline-flex; align-items: center; gap: 5px;
}
.chip i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.chip.off { opacity: .4; text-decoration: line-through; }

.diagram-wrap {
  position: relative;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 10px;
  box-shadow: var(--shadow);
  overflow: hidden;
  min-height: 220px;
}
#diagram { display: block; width: 100%; cursor: crosshair; touch-action: none; }
.tip {
  position: absolute; pointer-events: none; z-index: 3;
  max-width: 380px;
  background: var(--panel); color: var(--text);
  border: 1px solid var(--border); border-radius: 8px;
  box-shadow: var(--shadow);
  padding: 8px 10px; font-size: 12px;
}
.tip .h { font-weight: 600; margin-bottom: 3px; }
.tip pre { margin: 4px 0 0; font: 11px/1.4 var(--mono); white-space: pre-wrap; word-break: break-all; color: var(--muted); max-height: 180px; overflow: hidden; }

.scrub { height: 34px; }
#scrub-canvas { width: 100%; height: 34px; display: block; cursor: pointer; }

.panels { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 12px; min-height: 0; }
.panel {
  background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
  padding: 12px; min-width: 0; box-shadow: var(--shadow);
  max-height: 420px; overflow: auto;
}
.panel h3 .muted { text-transform: none; letter-spacing: 0; font-weight: 400; margin-left: 6px; font-family: var(--mono); }
.state-row { display: flex; gap: 12px; align-items: flex-start; }
#topology { width: 150px; height: 150px; flex-shrink: 0; }
.states { display: flex; flex-direction: column; gap: 6px; min-width: 0; flex: 1; }
.node {
  border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px;
  display: grid; grid-template-columns: 54px 1fr; gap: 2px 10px; align-items: center;
}
.node .id { font: 600 13px var(--mono); }
.node .role { font: 11px var(--mono); padding: 1px 6px; border-radius: 4px; display: inline-block; }
.node .facts { font: 11.5px var(--mono); color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; }
.node .facts b { color: var(--text); font-weight: 500; }
.node.down { opacity: .55; border-style: dashed; }
.logrow { grid-column: 2; display: flex; gap: 2px; flex-wrap: wrap; margin-top: 3px; }
.logrow i {
  width: 14px; height: 14px; border-radius: 3px; display: inline-block;
  font: 9px/14px var(--mono); text-align: center; font-style: normal; color: #0a0d13;
}
.logrow i.uncommitted { opacity: .45; outline: 1px dashed var(--faint); outline-offset: -1px; }
.kv { grid-column: 2; font: 11px var(--mono); color: var(--muted); }

.story { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 1px; }
.story li {
  display: grid; grid-template-columns: 62px 1fr; gap: 10px;
  padding: 4px 6px; border-radius: 6px; cursor: pointer; font-size: 12.5px;
}
.story li:hover { background: var(--panel-2); }
.story li.past { opacity: 1; }
.story li.future { opacity: .45; }
.story li.now { background: color-mix(in srgb, var(--accent) 12%, transparent); }
.story .t { font: 11.5px var(--mono); color: var(--muted); padding-top: 1px; }
.story .fault { color: var(--fault); }
.story .culprit, .story .violation { color: var(--bad); font-weight: 600; }
.story .op { color: var(--muted); }

@media (max-width: 980px) {
  .layout { grid-template-columns: 1fr; }
  .lab { border-right: 0; border-bottom: 1px solid var(--border); }
  .panels { grid-template-columns: 1fr; }
  .verdict { display: none; }
}
@media (max-width: 520px) {
  .viewer { padding: 10px 16px 16px; }
  .state-row { flex-direction: column; }
  .tag { display: none; }
}

</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
      <circle cx="16" cy="16" r="13" fill="none" stroke="currentColor" stroke-width="1.6" opacity=".35"/>
      <circle cx="16" cy="16" r="8" fill="none" stroke="currentColor" stroke-width="1.6" opacity=".6"/>
      <circle cx="16" cy="16" r="3.2" fill="currentColor"/>
      <circle cx="27" cy="11" r="2" fill="var(--bad)"/>
    </svg>
    <div>
      <div class="name">everett</div>
      <div class="tag">deterministic multiverse testing</div>
    </div>
  </div>
  <div id="verdict" class="verdict"></div>
  <div class="top-actions">
    <button id="btn-download" class="ghost" title="Download this universe as a repro file">⤓ repro</button>
    <button id="btn-theme" class="ghost" title="Toggle light/dark">◐</button>
  </div>
</header>

<main class="layout">
  <aside class="lab" id="lab">
    <section>
      <h2>Lab</h2>
      <label class="field">
        <span>System</span>
        <select id="sys"></select>
      </label>
      <p id="sys-summary" class="muted small"></p>
    </section>
    <section>
      <h3>Planted bugs</h3>
      <div id="bugs" class="bugs"></div>
    </section>
    <section class="row2">
      <label class="field"><span>Universes</span><input id="n-seeds" type="number" min="1" max="100000" value="2000"></label>
      <label class="field"><span>From seed</span><input id="n-start" type="number" min="1" value="1"></label>
    </section>
    <section class="buttons">
      <button id="btn-explore" class="primary">Explore the multiverse</button>
      <button id="btn-run" class="ghost" title="Run and show the 'from seed' universe">Run one</button>
    </section>
    <section>
      <canvas id="grid" class="grid" height="150" hidden></canvas>
      <div id="lab-status" class="lab-status muted small">Pick a bug (or none) and explore. Every universe is a different world of partitions, crashes, pauses and clock drift — all reproducible from its seed.</div>
    </section>
  </aside>

  <section class="viewer">
    <div class="toolbar">
      <div class="transport">
        <button id="btn-prev" class="icon" title="Previous event (←)">⏮</button>
        <button id="btn-play" class="icon" title="Play / pause (space)">▶</button>
        <button id="btn-next" class="icon" title="Next event (→)">⏭</button>
        <select id="speed" title="Playback speed">
          <option value="0.02">0.02×</option>
          <option value="0.1" selected>0.1×</option>
          <option value="0.5">0.5×</option>
          <option value="1">1×</option>
        </select>
        <span id="clock" class="clock">0.000s</span>
      </div>
      <div class="view-actions">
        <button id="btn-fit" class="ghost" title="Fit whole universe (f)">fit</button>
        <button id="btn-focus" class="ghost" title="Zoom to the violation (v)">violation</button>
        <div id="msg-filter" class="chips" title="Show/hide message types"></div>
      </div>
    </div>
    <div class="diagram-wrap" id="diagram-wrap">
      <canvas id="diagram"></canvas>
      <div id="tip" class="tip" hidden></div>
    </div>
    <div class="scrub" id="scrub">
      <canvas id="scrub-canvas"></canvas>
    </div>
    <div class="panels">
      <div class="panel">
        <h3>World state <span id="state-time" class="muted"></span></h3>
        <div class="state-row">
          <canvas id="topology" width="150" height="150" title="Who can talk to whom right now"></canvas>
          <div id="states" class="states"></div>
        </div>
      </div>
      <div class="panel">
        <h3>Story</h3>
        <ol id="story" class="story"></ol>
      </div>
    </div>
  </section>
</main>

// counter, so simultaneous events fire in the order they were scheduled —

// Jepsen-style workload: a handful of clients, each issuing one operation at a
// time against the cluster, with every invocation and completion written to a
// history. An operation that times out is "info" — it may or may not have
// happened — and the client continues as a fresh logical process, because the
// old operation might still land at any point in the future.

const { Rng, hash32 } = __require("src/rng.js");
const { CALL } = __require("src/world.js");

class History {
  constructor() { this.ops = []; }

  invoke(process, client, op, t) {
    const rec = {
      id: this.ops.length, process, client,
      f: op.f, key: op.key, value: op.value,
      invoke: t, complete: null, type: null, output: undefined,
    };
    this.ops.push(rec);
    return rec;
  }

  complete(rec, type, output, t) {
    rec.type = type;
    rec.output = output;
    rec.complete = t;
  }

  finalize() {
    for (const r of this.ops) if (r.type === null) r.type = 'info';
  }

class Workload {
  constructor(world, history, { generator, think = [0, 20], stopAt, start = 0 }) {
    this.world = world;
    this.history = history;
    this.generator = generator;
    this.think = think;
    this.stopAt = stopAt;
    this.start0 = start;
    this.nextProcess = 0;
    this.clients = [];
  }

  start() {
    const w = this.world;

      const actor = w.actors.get(id);
      const c = {
        id, actor,
        process: this.nextProcess++,
        rng: new Rng(hash32(w.seed, 'workload', actor.index)),
        busy: false,
      };
      this.clients.push(c);
      w.at(this.start0 + this.delay(c), () => this.next(c));
    }
  }

  delay(c) {
    const [lo, hi] = this.think;
    return Math.round(c.rng.uniform(lo, hi) * 1000);
  }

    const key = rng.pick(keys);
    const r = rng.float();
    const hist = written.get(key);

    if (r < reads + cas && hist.length > 0) {
      const from = rng.pick(hist.slice(-3));
      const to = ++counter;
      hist.push(to);
      return { f: 'cas', key, value: [from, to] };

    return { f: 'put', key, value: v };

//
// A scenario is plain JSON — topology, network weather, disk behaviour,
// workload mix and a timestamped fault schedule — generated from a seed. The
// run is a pure function of it. That makes a failing scenario a portable bug
// report, and it gives the shrinker something concrete to cut down.
//
// Generation uses swarm testing (Groce et al., ISSTA 2012): each universe
// enables a random *subset* of fault types and picks its own intensities.
// Universes with only one or two kinds of chaos explore deeper into those
// interactions than universes where everything happens at once.

const { ms } = __require("src/util.js");

const PARTITION_KINDS = ['halves', 'isolate', 'bridge', 'ring', 'oneway'];

    cas: round(swarm ? wr.uniform(0, 0.3) : 0.15),

  };

  return {
    everett: 1,
    system: system.name,
    seed,
    nodes,
    clients,
    duration: ms(duration),
    healAt: ms(healAt),
    liveness: d.liveness,
    network,
    disk: { loss: diskLoss },
    workload,
    faults,
    triggers,
    bugs: [...(opts.bugs || [])],

    swarm: { types, kinds, gap: Math.round(gap), maxLen: Math.round(maxLen), profile },

  const s = rng.shuffle([...nodes]);
  const n = s.length;

    for (const a of A) for (const b of B) cuts.push([a, b], [b, a]);

    }
    case 'isolate':
      sever([s[0]], s.slice(1));
      break;
    case 'bridge': {
      // s[0] can talk to both sides; the two sides cannot talk to each other.
      const rest = s.slice(1);
      const k = Math.ceil(rest.length / 2);
      sever(rest.slice(0, k), rest.slice(k));
      break;
    }
    case 'ring':
      // Each node hears only its two ring neighbours. Non-transitive.
      for (let i = 0; i < n; i++) {

      break;

      // s[0] still hears everyone, but nobody hears s[0].

// runScenario: build a universe from a scenario, run it, judge it.
//
// Verdicts come from three places, cheapest first:
//   1. monitors — invariants checked live as nodes emit events
//      (e.g. "two leaders in one term"); the run stops at the first breach;
//   2. liveness — after every fault is healed, the system must make progress;
//   3. the linearizability checker over the full client history.

const { World } = __require("src/world.js");
const { Recorder } = __require("src/trace.js");
const { History, Workload, kvGenerator } = __require("src/workload.js");
const { checkLinearizable } = __require("src/checker/linearizability.js");
const { fmtTime, hex32 } = __require("src/util.js");
const { mix32, hashString } = __require("src/rng.js");

function applyFault(world, f) {
  world.recorder?.fault(f);
  switch (f.type) {
    case 'partition': world.partition(f.cuts); break;
    case 'heal': world.heal(); break;
    case 'crash': world.crash(f.node); break;
    case 'restart': world.restart(f.node); break;
    case 'pause': world.pause(f.node); break;
    case 'resume': world.resume(f.node); break;
    case 'clock': world.setClock(f.node, f.rate, f.jump || 0); break;
    case 'heal-all':

      world.calmNetwork();
      for (const id of world.nodeIds) {
        world.resume(id);
        world.restart(id);
        const a = world.actors.get(id);

// Arm the event-triggered faults: each watches the emit stream, counts
// matching events, and strikes once — right after its nth match.
function armTriggers(world, scenario) {
  for (const tr of scenario.triggers || []) {
    let count = 0;
    let fired = false;
    world.hooks.push((e) => {
      if (fired || e.kind !== tr.on.kind || (tr.on.node && e.node !== tr.on.node)) return;
      if (++count !== tr.on.nth) return;
      fired = true;
      if (world.now >= scenario.healAt) return;

      if (!world.actors.has(node) || world.actors.get(node).kind !== 'node') return;

  };

        key: lin.key,
        culprit: c ? c.id : null,
        involved: lin.ops.map((o) => o.id),
        linearized: lin.linearized,
      };
    }

  let fp = world.fp1 ^ world.fp2;
  for (const o of history.ops) {
    fp = mix32(fp ^ hashString(`${o.process}|${o.f}|${o.key}|${JSON.stringify(o.value)}|${o.type}|${JSON.stringify(o.output)}|${o.invoke}|${o.complete}`));

  const result = {
    ok: !world.violation,
    violation: world.violation,
    fingerprint: world.fingerprint + hex32(fp),
    stats: {
      ...world.stats,
      ops: ops.length,
      okOps: ops.filter((o) => o.type === 'ok').length,
      infoOps: ops.filter((o) => o.type === 'info').length,
      faults: scenario.faults.length + (scenario.triggers || []).length,
      linSteps: lin ? lin.steps : 0,
      linUnknown: lin ? !!lin.unknown : false,
    },
  };

    result.trace = {
      ...recorder.toJSON(),
      history: ops,
      violation: world.violation,
      scenario,
      fingerprint: result.fingerprint,
    };
  }
  return result;
}

"src/checker/linearizability.js": function (__exports, __require) {
// Linearizability checking — Wing & Gong's search with Lowe's memoization,
// the same algorithm behind Porcupine and Knossos.
//
// A history is linearizable if every operation can be assigned a single
// instant, between its invocation and its completion, such that replaying the
// operations in that order through a sequential model reproduces every
// observed output. Operations with unknown outcomes ("info") get an infinite
// completion time: they may take effect at any point after they began, or
// never. Histories are split per key first (P-compositionality), which turns
// an exponential search into many small ones.

function checkLinearizable(ops, model, { budget = 5_000_000 } = {}) {
  const parts = new Map();
  for (const op of ops) {
    if (op.type === 'fail') continue; // definitely did not happen
    if (op.type === 'info' && model.readOnly(op)) continue; // no effect, no output
    const k = model.partition(op);
    if (!parts.has(k)) parts.set(k, []);
    parts.get(k).push(op);
  }
  let steps = 0;
  let unknown = false;
  for (const [key, list] of parts) {
    const r = checkPartition(list, model, budget - steps);
    steps += r.steps;
    if (r.unknown) { unknown = true; continue; }
    if (!r.ok) return { ok: false, key, steps, ...r };
  }
  return { ok: true, unknown, steps };
}

const CALL = 0, RET = 1;

function checkPartition(ops, model, budget) {
  const n = ops.length;
  const calls = new Array(n);
  const entries = [];
  for (let i = 0; i < n; i++) {
    const op = ops[i];
    const ret = op.type === 'ok' ? op.complete : Infinity;
    const c = { kind: CALL, time: op.invoke, i, op, prev: null, next: null, match: null };
    const r = { kind: RET, time: ret, i, op, prev: null, next: null, match: null };
    c.match = r;
    calls[i] = c;
    entries.push(c, r);
  }
  // At equal timestamps calls sort before returns, so touching operations
  // count as concurrent — the conservative reading.
  entries.sort((a, b) => (a.time - b.time) || (a.kind - b.kind) || (a.i - b.i));

  const head = { prev: null, next: null };
  let prev = head;
  for (const e of entries) { e.prev = prev; prev.next = e; prev = e; }

  const lift = (e) => {
    e.prev.next = e.next;
    e.next.prev = e.prev;
    const m = e.match;
    m.prev.next = m.next;
    if (m.next) m.next.prev = m.prev;
  };
  const unlift = (e) => {
    const m = e.match;
    m.prev.next = m;
    if (m.next) m.next.prev = m;
    e.prev.next = e;
    e.next.prev = e;
  };

  const words = Math.max(1, Math.ceil(n / 32));
  const bits = new Uint32Array(words);
  const flip = (i) => { bits[i >>> 5] ^= 1 << (i & 31); };
  const bitsKey = () => {
    let s = '';
    for (let w = 0; w < words; w++) s += bits[w].toString(36) + ',';
    return s;
  };

  const cache = new Set();
  const stack = [];
  let state = model.init();
  let entry = head.next;
  let steps = 0;
  let best = { depth: -1, op: null, order: [] };

  while (head.next !== null) {
    if (++steps > budget) return { ok: true, unknown: true, steps };
    if (entry.kind === CALL) {
      const [ok, next] = model.step(state, entry.op);
      if (ok) {
        flip(entry.i);
        const key = bitsKey() + model.hash(next);
        if (!cache.has(key)) {
          cache.add(key);
          stack.push(entry, state);
          state = next;
          lift(entry);
          entry = head.next;
          continue;
        }
        flip(entry.i);
      }
      entry = entry.next;
    } else {
      // We reached the completion of an operation we could not place before
      // it: this branch is dead. Remember the deepest dead end — the op stuck
      // there is the best explanation of what went wrong.
      const depth = stack.length >> 1;
      if (depth > best.depth) {
        const order = [];
        for (let s = 0; s < stack.length; s += 2) order.push(stack[s].op.id);
        best = { depth, op: entry.op, order };
      }
      if (stack.length === 0) {
        return { ok: false, steps, culprit: best.op, linearized: best.order, ops };
      }
      const s = stack.pop();
      const e = stack.pop();
      state = s;
      flip(e.i);
      unlift(e);
      entry = e.next;
    }
  }
  return { ok: true, steps };
}

// The shrinker: from "this universe broke" to "this is why".
//
// A failing universe typically contains dozens of faults and hundreds of
// operations, nearly all of them irrelevant. Shrinking happens in two moves:
//
//   * Structural: propose a simpler universe — shorter, fewer faults (delta
//     debugging over fault groups), fewer nodes and clients, calmer network —
//     and keep any proposal that still fails *the same way* (same violation
//     signature). Runs are deterministic, so every proposal is a fair test.
//
//   * Resampling: removing an early fault perturbs everything after it (the
//     butterfly effect), so structural shrinking can get stuck. When it does,
//     we generate fresh universes from the *same recipe, made smaller* — only
//     the fault types still present, fewer of them, a shorter run — and
//     structurally shrink any that fail the same way. The smallest wins.

const { hash32 } = __require("src/rng.js");

    faults: s.faults.filter((f) => f.type !== 'heal-all').length + (s.triggers || []).length,
    nodes: s.nodes.length,
    clients: s.clients.length,
    duration: s.duration,
    ops: result ? result.stats.ops : undefined,
  };
}

// Lower is simpler: faults dominate, then how much story there is to read.
function complexity(size) {
  return size.faults * 100 + (size.ops || 0) + size.duration / 100_000 + size.nodes * 5 + size.clients * 5;

function shrink(system, scenario, baseline, { maxRuns = 600, resample = true, onStep } = {}) {

  const budget = { runs: 0, max: maxRuns };
  const first = structural(system, scenario, baseline, budget, onStep);
  let best = first;
  if (resample) {
    for (let round = 0; round < 4 && budget.runs < budget.max; round++) {
      const found = resampleSmaller(system, best, budget, round, onStep);
      if (!found) break;
      const s = structural(system, found.scenario, found.result, budget, onStep);
      if (complexity(s.to) < complexity(best.to)) best = { ...s, steps: [...best.steps, `resampled universe ${found.scenario.seed}`, ...s.steps] };
      else break;
    }

  return {
    scenario: best.scenario,
    result: best.result,
    runs: budget.runs,
    steps: best.steps,
    from: scenarioSize(scenario, baseline),
    to: best.to,

// Draw fresh universes from a smaller version of the failing universe's
// recipe. Returns the first that fails the same way and is already simpler.
function resampleSmaller(system, best, budget, round, onStep) {
  const s = best.scenario;
  const sig = best.result.violation.signature;
  const types = new Set();
  for (const f of s.faults) {
    if (f.type === 'partition' || f.type === 'heal') types.add('partition');
    else if (f.type === 'crash' || f.type === 'restart') types.add('crash');
    else if (f.type === 'pause' || f.type === 'resume') types.add('pause');

    const seed = hash32(s.seed, 'resample', round, i);

    const want = Math.max(1, Math.round((best.to.faults / 2) * (1 - i / attempts)));

      bugs: s.bugs,
      params: s.params,
      nodes: s.nodes.length,
      clients: Math.max(1, s.clients.length),
      duration: durationMs,
      quiesce: 0,
      faults: [...types],

      triggers: (s.triggers || []).length ? Math.min(want, (s.triggers || []).length) : false,

      const ns = best.nodes;
      outer: for (let i = ns.length - 1; i >= 0; i--) {
        for (let j = i - 1; j >= 0; j--) {
          if (attempt(`${ns.length - 2} nodes`, withoutNodes(best, [ns[i], ns[j]]))) { shrunk = true; break outer; }
          if (budget.runs >= maxRuns) break outer;
        }
      }
      if (!shrunk) break;
      progress = true;
    }

    // 5. Fewer clients.
    for (let k = 1; k < best.clients.length; k++) {
      if (attempt(`${k} client${k > 1 ? 's' : ''}`, { ...best, clients: best.clients.slice(0, k) })) { progress = true; break; }
    }

    // 6. Calmer network.
    const net = best.network;
    if (net.drop > 0 && attempt('no packet loss', { ...best, network: { ...net, drop: 0 } })) progress = true;
    if (best.network.dup > 0 && attempt('no duplication', { ...best, network: { ...best.network, dup: 0 } })) progress = true;
    if (best.network.latency.tail > 0 &&
      attempt('no latency spikes', { ...best, network: { ...best.network, latency: { ...best.network.latency, tail: 0 } } })) progress = true;

    // 7. Only the key that broke.
    const key = bestResult.violation.key;

// Zeller's ddmin over fault groups: try removing big chunks first, then
// smaller ones, keeping whatever removal still reproduces the failure.
function ddminGroups(scenario, test) {
  const groupsOf = (s) => [...new Set(s.faults.filter((f) => f.group > 0).map((f) => f.group))];
  let current = scenario;

  while (groups.length > 0) {
    const size = Math.ceil(groups.length / n);
    let reduced = false;
    for (let i = 0; i < groups.length; i += size) {
      const drop = new Set(groups.slice(i, i + size));

        groups = groupsOf(current);

      n = Math.min(n * 2, groups.length);
    }

}

// The multiverse explorer: run universe after universe until one breaks.
//
// exploreSync is for scripts and tests; exploreAsync yields to the event loop
// so a browser tab stays responsive while it searches. For many cores, see
// src/node/parallel.js.

const { makeScenario } = __require("src/scenario.js");
const { runScenario } = __require("src/run.js");
const { shrink } = __require("src/shrink.js");

const clock = () => (globalThis.performance ? performance.now() : Date.now());

function exploreSync(system, { seeds = 1000, start = 1, bugs = [], overrides = {}, stopOnFirst = true, onUniverse } = {}) {
  const t0 = clock();
  const failures = [];
  let explored = 0;
  for (let i = 0; i < seeds; i++) {
    const seed = start + i;
    const scenario = makeScenario(system, seed, { ...overrides, bugs });
    const result = runScenario(system, scenario);
    explored++;
    onUniverse?.({ seed, result, explored });
    if (!result.ok) {
      failures.push({ seed, scenario, result });
      if (stopOnFirst) break;
    }
  }
  return { explored, failures, elapsed: clock() - t0 };
}

async function exploreAsync(system, {
  seeds = 1000, start = 1, bugs = [], overrides = {}, stopOnFirst = true,
  onUniverse, shouldStop, sliceMs = 24,
} = {}) {
  const t0 = clock();
  const failures = [];
  let explored = 0;
  let sliceStart = clock();
  for (let i = 0; i < seeds; i++) {
    if (shouldStop?.()) break;
    const seed = start + i;
    const scenario = makeScenario(system, seed, { ...overrides, bugs });
    const result = runScenario(system, scenario);
    explored++;
    onUniverse?.({ seed, result, explored });
    if (!result.ok) {
      failures.push({ seed, scenario, result });
      if (stopOnFirst) break;
    }
    if (clock() - sliceStart > sliceMs) {
      await new Promise((r) => setTimeout(r, 0));
      sliceStart = clock();
    }
  }
  return { explored, failures, elapsed: clock() - t0 };
}

// Shrink a failure and re-run the minimal universe with full recording.
function investigate(system, failure, { maxRuns = 500, onStep } = {}) {
  const shrunk = shrink(system, failure.scenario, failure.result, { maxRuns, onStep });
  const replay = runScenario(system, shrunk.scenario, { record: true });
  const deterministic = replay.fingerprint === shrunk.result.fingerprint;
  return { ...shrunk, trace: replay.trace, fingerprint: replay.fingerprint, deterministic };
}

__exports.exploreAsync = exploreAsync;
__exports.investigate = investigate;

// Narration: turn a recorded universe into a story a human can read in ten
// seconds. Faults, elections, the operations that matter, and the violation.

      const groups = components(nodes, f.cuts);
      if (groups.length > 1) {
        return `network partition (${f.kind}): ${groups.map((g) => `{${g.join(' ')}}`).join(' ⟂ ')}${why}`;
      }
      if (f.kind === 'bridge') {
        const counts = new Map(nodes.map((n) => [n, 0]));
        for (const [a] of f.cuts) counts.set(a, counts.get(a) + 1);
        const bridge = nodes.find((n) => counts.get(n) === 0);
        return `bridge partition: only ${bridge} can see both sides${why}`;
      }
      return `${f.kind} partition: ${f.cuts.length / 2} links severed, every node sees only its neighbours${why}`;
    }
    case 'heal': return 'network heals';
    case 'crash': return `${f.node} crashes${why}`;
    case 'restart': return `${f.node} restarts, recovering from its disk`;
    case 'pause': return `${f.node} freezes (stop-the-world pause)${why}`;
    case 'resume': return `${f.node} wakes up, unaware that time has passed`;
    case 'clock':
      if (f.rate === 1) return `${f.node}'s clock is corrected`;
      return `${f.node}'s clock starts running ${f.rate}× ${f.rate > 1 ? 'fast' : 'slow'}` +
        (f.jump ? ` and jumps ${f.jump > 0 ? '+' : ''}${f.jump}ms` : '');

__exports.narrate = narrate;

// Sequential specifications for the linearizability checker.
//
// A model is { init, step(state, op) -> [ok, nextState], hash, partition,
// readOnly, describe, explain }. step() receives the *completed* operation, so
// it can check observed outputs against what the sequential object would say.

const { deepEqual, fmtTime } = __require("src/util.js");

const show = (v) => (v === null || v === undefined ? 'nil' : JSON.stringify(v));

// A map of independent read/write/compare-and-set registers.
const kvModel = {
  name: 'kv-register',
  partition: (op) => op.key,
  readOnly: (op) => op.f === 'get',
  init: () => null,
  hash: (s) => (s === null ? '∅' : JSON.stringify(s)),

  step(state, op) {
    switch (op.f) {
      case 'get':
        return [op.type !== 'ok' || deepEqual(op.output ?? null, state), state];
      case 'put':
        return [true, op.value];
      case 'cas': {
        const [from, to] = op.value;
        if (op.type === 'ok') {
          return op.output === true ? [deepEqual(state, from), to] : [!deepEqual(state, from), state];
        }
        return [true, deepEqual(state, from) ? to : state];
      }
      default:
        throw new Error(`kv model: unknown op ${op.f}`);
    }
  },

  describe(op) {
    const res = op.type === 'ok' ? '' : op.type === 'info' ? ' ?' : ' ✗';
    switch (op.f) {
      case 'get': return `get ${op.key}` + (op.type === 'ok' ? ` → ${show(op.output)}` : res);
      case 'put': return `put ${op.key}=${show(op.value)}${res}`;
      case 'cas': return `cas ${op.key} ${show(op.value[0])}→${show(op.value[1])}` +
        (op.type === 'ok' ? (op.output ? ' ✓' : ' ✗') : res);
    }
    return `${op.f} ${op.key}`;
  },

  // Turn "no valid linearization" into a sentence a human can act on.
  explain(result) {
    const { culprit: c, ops, key } = result;
    if (!c) return `no valid ordering of operations on key "${key}"`;
    const who = `${c.client} ${kvModel.describe(c)}`;
    const writes = ops.filter((o) =>
      o.type === 'ok' && (o.f === 'put' || (o.f === 'cas' && o.output === true)));
    const wrote = (o) => (o.f === 'put' ? o.value : o.value[1]);
    if (c.f === 'get' && c.type === 'ok') {
      const v = c.output ?? null;
      if (v === null) {
        const w = writes.find((o) => o.complete < c.invoke);
        if (w) return `${who} at ${fmtTime(c.complete)} — but ${w.client} had already written ${show(wrote(w))} ` +
          `(acknowledged at ${fmtTime(w.complete)}). An acknowledged write vanished.`;
      }
      const src = ops.find((o) => (o.f === 'put' && deepEqual(o.value, v)) || (o.f === 'cas' && deepEqual(o.value[1], v)));
      if (!src && v !== null) return `${who} — but no operation ever wrote ${show(v)}. A phantom value.`;
      if (src) {
        const newer = writes.find((o) => o !== src && src.complete !== null && o.invoke > src.complete && o.complete < c.invoke);
        if (newer) {
          return `${who} at ${fmtTime(c.complete)} — a stale read: ${newer.client} overwrote it with ` +
            `${show(wrote(newer))}, acknowledged at ${fmtTime(newer.complete)}, before this read even began.`;
        }
      }
      return `${who} — no ordering of the concurrent writes can produce that value at that moment.`;
    }
    if (c.f === 'cas' && c.type === 'ok') {
      return c.output
        ? `${who} — but the register never held ${show(c.value[0])} at any moment inside this operation's window.`
        : `${who} — but the register held ${show(c.value[0])} throughout this operation's window, so the CAS should have succeeded.`;
    }
    return `${who} cannot be placed anywhere in its window consistently with the other operations.`;
  },

// only of current-term entries, persistence with fsync before every

// of them a bug that has shipped in a real consensus implementation.

    'Leader answers reads from local state without confirming it is still leader. A deposed leader on the wrong side of a partition serves stale data.',
  'ack-before-commit':

  'forget-vote':

// A Raft client with honest failure semantics.
//
// It follows leader hints and retries on "not leader" (the request was
// definitely not appended). But once a request has gone unanswered, it can
// never say "failed" — the request might still be sitting in some node's log,
// waiting to be committed by a future leader. So timeouts and give-ups are
// reported as "info": outcome unknown. The checker knows how to handle those.

class RaftClient {
  constructor(ctx, { params = {}, scenario } = {}) {
    this.ctx = ctx;
    this.timeout = params.opTimeout ?? scenario?.workload?.opTimeout ?? 1000;
    this.maxAttempts = 10;
    this.leader = null;
    this.reqSeq = 0;
    this.opSeq = 0;
    this.cur = null;
  }

  invoke(op, done) {
    this.cur = { op, done, opId: ++this.opSeq, attempts: 0, reqId: 0, timer: null };
    this.attempt();
  }

  attempt() {
    const c = this.cur;
    c.attempts++;
    const nodes = this.ctx.nodes;
    const target = this.leader ?? nodes[this.ctx.randomInt(0, nodes.length - 1)];
    c.reqId = ++this.reqSeq;
    this.ctx.send(target, { type: 'ClientRequest', reqId: c.reqId, opId: c.opId, op: c.op });
    c.timer = this.ctx.setTimer(this.timeout, () => {
      this.leader = null;
      this.finish({ type: 'info' });
    });
  }

  finish(res) {
    const c = this.cur;
    if (!c) return;
    this.ctx.cancelTimer(c.timer);
    this.cur = null;
    c.done(res);
  }

  onMessage(from, m) {
    const c = this.cur;
    if (m.type !== 'ClientResponse' || !c || m.reqId !== c.reqId) return;
    this.ctx.cancelTimer(c.timer);
    if (m.notLeader) {
      const others = this.ctx.nodes.filter((n) => n !== from);
      this.leader = m.leader && m.leader !== from ? m.leader : others[this.ctx.randomInt(0, others.length - 1)];
      if (c.attempts >= this.maxAttempts) return this.finish({ type: 'info' });
      c.timer = this.ctx.setTimer(5 * c.attempts, () => this.attempt());
      return;
    }
    if (m.unknown) return this.finish({ type: 'info' });
    this.leader = from;
    this.finish({ type: 'ok', value: m.value });
  }
}

},

// Raft's safety properties (Figure 3 of the paper), checked live.
//
// Monitors see the stream of events nodes emit and keep their own god's-eye
// memory of the universe — something no real node could ever have.

function raftSafety() {
  const leaders = new Map(); // term -> node
  const applied = new Map(); // index -> { id, term, node }
  return {
    name: 'raft-safety',
    onEmit(e) {
      if (e.kind === 'leader') {
        const prev = leaders.get(e.data.term);
        if (prev && prev !== e.node) {
          return {
            rule: 'election-safety',
            message: `Election Safety violated: ${prev} and ${e.node} were both elected leader of term ${e.data.term}`,
          };
        }
        leaders.set(e.data.term, e.node);
      } else if (e.kind === 'apply') {
        const prev = applied.get(e.data.index);
        if (!prev) applied.set(e.data.index, { ...e.data, node: e.node });
        else if (prev.id !== e.data.id || prev.term !== e.data.term) {
          return {
            rule: 'state-machine-safety',
            message: `State Machine Safety violated: at log index ${e.data.index}, ${prev.node} applied ` +
              `${prev.id} (term ${prev.term}) but ${e.node} applied ${e.data.id} (term ${e.data.term})`,
          };
        }
      } else if (e.kind === 'truncate' && e.data.from <= e.data.commit) {
        return {
          rule: 'leader-completeness',
          message: `${e.node} discarded committed entries: truncated its log from index ${e.data.from} ` +
            `although index ${e.data.commit} was already committed`,
        };
      }
      return null;
    },
  };
}

__exports.raftSafety = raftSafety;
},

// Lease-based locking — the argument at the heart of "How to do distributed
// locking" (Kleppmann, 2016) and the Redlock debate, made executable.
//
// Workers increment a shared counter with read-modify-write. A lock server
// hands out leases (with monotonically increasing tokens) so only one worker
// is supposed to be in the critical section at a time. Workers even double-
// check their lease on their own clock before writing.
//
// It still isn't safe: a worker can be paused (GC, VM migration, swapping)
// between checking its lease and writing, or its clock can drift. The fix is
// fencing: the storage rejects requests carrying a token older than one it
// has already seen. And — the part people miss — the storage must register
// tokens on *reads* too, or a stale read slips through and an increment is
// still lost.

const BUGS = {
  'no-fencing':
    'The store ignores lease tokens and trusts that whoever writes holds the lock. A worker that stalls after checking its lease overwrites newer data.',
  'fence-writes-only':
    'The store fences writes but not reads. A stale holder can still read, then write before the new holder does, and an increment is lost.',
};

const LEASE_MS = 100;

class LockServer {
  constructor(ctx) { this.ctx = ctx; }

    this.holder = null;
    this.expires = 0;
    this.token = 0;

        this.token++;

      } else {
        this.ctx.send(from, { type: 'busy', reqId: m.reqId, retryIn: this.expires - now });
      }

  }

    return { role: this.holder ? 'locked' : 'free', holder: this.holder, token: this.token, expires: Math.round(this.expires) };

  onMessage(from, m) {

      if (fenceReads) this.maxToken = Math.max(this.maxToken, m.token);

class Worker {
  constructor(ctx) { this.ctx = ctx; }

  finishWork() {

    if (this.ctx.now() >= this.leaseEnd) {

            ? `${last.worker} (token ${last.token}) wrote ${last.value} after its lease had already passed to ${d.worker} — ` +

    },
    onEnd(world) {

    },

const system = {
  name: 'lease-lock',
  title: 'Lease lock + fencing',
  summary: 'Workers incrementing a shared counter under a lease-based lock (Kleppmann vs. Redlock).',
  defaults: { duration: 6000, quiesce: 1500, network: { dup: 0 } },
  topology(rng) {

      case 'expired': return 'sees its lease has expired and backs off';
      case 'fenced': return `is fenced off: token ${e.data.token} < ${e.data.maxToken}`;

    read: 'blue', value: 'blue',
    write: 'teal', written: 'teal',
    rejected: 'red',

__exports.system = system;

"examples/gossip-register/index.js": function (__exports, __require) {
// The smallest interesting system: a replicated register where every node
// accepts writes, applies them locally, and gossips them to its peers.
// It is fast, simple, always available… and not linearizable.
//
//   everett explore examples/gossip-register
//
// This file is the template for testing your own system with Everett.

const { kvModel, kvGenerator } = __require("src/index.js");

class Replica {
  constructor(ctx) {
    this.ctx = ctx;
    this.data = new Map();
  }

  onMessage(from, m) {
    if (m.type === 'put') {
      this.data.set(m.key, m.value);
      for (const peer of this.ctx.peers) this.ctx.send(peer, { type: 'sync', key: m.key, value: m.value });
      this.ctx.send(from, { type: 'reply', id: m.id, value: true });
    } else if (m.type === 'get') {
      this.ctx.send(from, { type: 'reply', id: m.id, value: this.data.get(m.key) ?? null });
    } else if (m.type === 'sync') {
      this.data.set(m.key, m.value);
    }
  }

  // Optional: what the time-travel debugger shows for this node.
  inspect() {
    return { role: 'replica', kv: Object.fromEntries(this.data) };
  }
}

class Client {
  constructor(ctx) {
    this.ctx = ctx;
    this.seq = 0;
    this.pending = null;
  }

  // Called by the workload with { f, key, value }. Report exactly once:
  // { type: 'ok', value } on success, { type: 'info' } if the outcome is unknown.
  invoke(op, done) {
    const id = ++this.seq;
    const node = this.ctx.nodes[this.ctx.randomInt(0, this.ctx.nodes.length - 1)];
    this.ctx.send(node, { type: op.f, key: op.key, value: op.value, id });
    const timer = this.ctx.setTimer(500, () => { this.pending = null; done({ type: 'info' }); });
    this.pending = { id, done, timer };
  }

  onMessage(from, m) {
    if (!this.pending || m.id !== this.pending.id) return;
    const { done, timer } = this.pending;
    this.ctx.cancelTimer(timer);
    this.pending = null;
    done({ type: 'ok', value: m.value });
  }
}

const system = {
  name: 'gossip-register',
  title: 'Gossip register',
  summary: 'Every node accepts writes and gossips them. Always available, never linearizable.',
  defaults: { nodes: 3, clients: 3 },
  createNode: (ctx) => new Replica(ctx),
  createClient: (ctx) => new Client(ctx),
  workload: () => kvGenerator({ keys: ['x'], reads: 0.5, cas: 0 }),
  model: kvModel,
  describe: () => null,
};

__exports.system = system;
},
"viz/app.js": function (__exports, __require) {
// Everett Lab: the time-travel debugger and the in-browser multiverse.

// Everything runs client-side. The same engine the CLI uses explores
// universes here, shrinks the first one that breaks, replays it with full
// recording, and hands the trace to the space-time diagram below.

const { makeScenario, runScenario, exploreAsync, shrink, narrate, fmtTime, models } = __require("src/index.js");
const { system: raft } = __require("examples/raft/index.js");
const { system: leaseLock } = __require("examples/lease-lock/index.js");
const { system: gossip } = __require("examples/gossip-register/index.js");

const SYSTEMS = { raft, 'lease-lock': leaseLock, 'gossip-register': gossip };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[ch]);

const AXIS_H = 26, LABEL_W = 64, PAD_R = 16, NODE_H = 46, CLIENT_H = 30, BOTTOM = 12;

const ROLE_COLOR = {
  leader: 'leader', candidate: 'candidate', follower: 'follower',
  locked: 'leader', free: 'follower', store: 'm-teal',
  reading: 'm-blue', working: 'leader', writing: 'm-orange',
  acquiring: 'follower', waiting: 'follower', idle: 'follower',

const S = {
  system: raft,
  trace: null,
  m: null,
  view: { t0: 0, t1: 1 },
  cursor: 0,
  playing: false,
  speed: 0.1,
  hidden: new Set(),
  hover: null,
  colors: {},
  exploring: false,
  grid: null,
  fingerprint: null,
  bugs: [],
};

// ── colours ──────────────────────────────────────────────────────────────────

const COLOR_KEYS = ['bg', 'panel', 'panel-2', 'border', 'text', 'muted', 'faint', 'grid', 'accent', 'leader', 'candidate',
  'follower', 'ok', 'info', 'failop', 'bad', 'fault', 'pause', 'm-blue', 'm-teal', 'm-violet', 'm-orange', 'm-red', 'm-gray'];

function readColors() {
  const cs = getComputedStyle(document.documentElement);
  for (const k of COLOR_KEYS) S.colors[k] = cs.getPropertyValue('--' + k).trim();
}

const msgColor = (type) => col('m-' + ((S.system.messageColors || {})[type] || 'gray'));
const roleColor = (role) => col(ROLE_COLOR[role] || 'm-gray');

  }

// ── trace → render model ─────────────────────────────────────────────────────

function prepare(trace, system) {
  const lanes = [
    ...trace.nodes.map((id) => ({ id, kind: 'node', h: NODE_H })),
    ...trace.clients.map((id) => ({ id, kind: 'client', h: CLIENT_H })),
  ];
  let y = AXIS_H;
  for (const l of lanes) { l.y = y + l.h / 2; y += l.h; }

  const laneOf = new Map(lanes.map((l) => [l.id, l]));
  const end = Math.max(trace.end, 1);

  // Per-node snapshots for "state at time t".
  const snaps = new Map(trace.nodes.map((id) => [id, []]));
  for (const s of trace.snapshots) snaps.get(s.node)?.push(s);

  const segs = new Map();

    for (const l of trace.life) if (l.node === id) evs.push({ t: l.t, life: l.what });

    lanes, laneOf, height, end, snaps, segs, bands, marks, types, involved,
    times: [...times].sort((a, b) => a - b),
